<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小圈子 | 异地好友分享</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf8f3;--surface:#fff;--surface2:#faf6f1;--border:#ede8e0;
  --text:#2d2520;--muted:#9e8e80;--dim:#c8bdb0;
  --accent:#e8734a;--green:#6b9e78;--blue:#7b8fc4;--pink:#e8a0b0;
  --shadow:0 2px 16px rgba(45,37,32,.08);--shadow-lg:0 8px 40px rgba(45,37,32,.14);
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}

/* Auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf8f3,#fdf0e8);}
.auth-box{background:var(--surface);border-radius:24px;padding:40px 36px;width:400px;max-width:90vw;box-shadow:var(--shadow-lg);}
.auth-logo{font-family:'Lora',serif;font-size:32px;color:var(--accent);margin-bottom:6px;text-align:center;}
.auth-tagline{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6;text-align:center;}
.auth-tabs{display:flex;margin-bottom:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.auth-tab{flex:1;padding:10px;background:transparent;border:none;font-family:inherit;font-size:13px;cursor:pointer;color:var(--muted);transition:all .2s;}
.auth-tab.active{background:var(--accent);color:#fff;}
.auth-field{margin-bottom:12px;}
.auth-label{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;}
.auth-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;font-family:inherit;font-size:13px;border-radius:10px;outline:none;transition:border-color .2s;}
.auth-input:focus{border-color:var(--accent);}
.auth-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s;margin-top:4px;}
.auth-btn:hover{opacity:.85;}.auth-btn:disabled{opacity:.5;cursor:not-allowed;}
.auth-err{font-size:12px;color:#e87b8a;margin-top:8px;text-align:center;min-height:18px;}
.avatar-grid{display:flex;gap:8px;flex-wrap:wrap;}
.avatar-opt{font-size:22px;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent;transition:border-color .15s;}
.avatar-opt.selected{border-color:var(--accent);}

/* App Layout */
.app-layout{display:none;height:100vh;overflow:hidden;}
.app-layout.visible{display:flex;}

/* Sidebar (Desktop) / Nav (Mobile) */
.sidebar{width:68px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:4px;position:fixed;left:0;top:0;bottom:0;z-index:50;}
.sidebar-logo{font-family:'Lora',serif;font-size:20px;color:var(--accent);margin-bottom:14px;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:19px;cursor:pointer;transition:all .2s;color:var(--dim);position:relative;}
.nav-icon:hover{background:var(--surface2);color:var(--text);}
.nav-icon.active{background:rgba(232,115,74,.1);color:var(--accent);}
.nav-badge{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:2px solid var(--surface);display:none;}
.nav-badge.show{display:block;}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;}
.my-avatar-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid var(--border);cursor:pointer;background:linear-gradient(135deg,#e8734a20,#e8a0b020);}

/* Main Content */
.main-area{margin-left:68px;display:flex;width:calc(100vw - 68px);height:100vh;overflow:hidden;}
.left-col{width:210px;min-width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.col-header{padding:16px 14px 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.col-add-btn{width:20px;height:20px;border-radius:6px;background:var(--surface2);border:none;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.circles-list{overflow-y:auto;flex:1;padding:8px 6px;}
.circle-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px;}
.circle-item.active{background:rgba(232,115,74,.08);color:var(--accent);}
.circle-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.feed-col{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow);}
.composer-top{display:flex;gap:10px;align-items:flex-start;}
.composer-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(135deg,rgba(232,115,74,.1),rgba(232,160,176,.1));}
.composer-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;color:var(--text);resize:none;outline:none;min-height:42px;}
.composer-bottom{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);position:relative;}
.post-btn{margin-left:auto;background:var(--accent);color:#fff;border:none;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;}

/* Posts */
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--surface2);}
.post-meta{flex:1;}
.post-author{font-size:13px;font-weight:500;}
.post-time{font-size:10px;color:var(--muted);}
.post-body{font-size:13px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;}
.post-images{display:grid;gap:4px;margin-bottom:12px;border-radius:10px;overflow:hidden;}
.post-images.n1{grid-template-columns:1fr;}
.post-images.n2{grid-template-columns:1fr 1fr;}
.post-img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;}
.emoji-chip{font-size:12px;padding:2px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;margin-right:4px;display:inline-flex;align-items:center;gap:3px;}
.emoji-chip.mine{background:rgba(232,115,74,.1);border-color:var(--accent);}

/* Right Column */
.right-col{width:250px;min-width:250px;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:18px 14px;}
.right-section{margin-bottom:20px;}
.right-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

/* Panels & Modals */
.panel-overlay{position:fixed;inset:0;z-index:100;background:rgba(45,37,32,.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;}
.panel-overlay.open{display:flex;}
.profile-box{background:var(--surface);border-radius:20px;width:440px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;}
.dm-panel{position:fixed;inset:0;z-index:100;background:rgba(45,37,32,.35);display:none;align-items:flex-end;justify-content:flex-end;padding:20px;}
.dm-panel.open{display:flex;}
.dm-box{background:var(--surface);border-radius:16px;width:340px;height:500px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.dm-messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;}
.dm-msg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:12px;line-height:1.6;}
.dm-msg.mine{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.dm-msg.theirs{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px;}

/* ⚠️ 移动端适配补丁 ⚠️ */
@media (max-width: 768px) {
  .left-col, .right-col { display: none !important; }
  .main-area { margin-left: 0; width: 100vw; }
  .sidebar { 
    width: 100%; height: 65px; bottom: 0; top: auto; 
    flex-direction: row; padding: 0 10px; 
    border-right: none; border-top: 1px solid var(--border);
    justify-content: space-around; align-items: center;
  }
  .sidebar-logo { display: none; }
  .sidebar-bottom { margin-top: 0; }
  .nav-icon { width: 50px; height: 50px; }
  .feed-col { padding: 12px; padding-bottom: 90px; }
  .profile-box { width: 100vw; height: 90vh; border-radius: 20px 20px 0 0; align-self: flex-end; }
  .dm-panel { padding: 0; }
  .dm-box { width: 100vw; height: 100vh; border-radius: 0; }
}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:999;display:none;}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">○ 小圈子</div>
    <div class="auth-tagline">和最好的朋友分享此刻 🌸</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" id="registerTab" onclick="switchTab('register')">注册</button>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label class="auth-label">邮箱</label><input class="auth-input" id="loginEmail" type="email"></div>
      <div class="auth-field"><label class="auth-label">密码</label><input class="auth-input" id="loginPassword" type="password"></div>
      <button class="auth-btn" id="loginBtn" onclick="doLogin()">进入圈子</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="auth-field"><label class="auth-label">昵称</label><input class="auth-input" id="regName"></div>
      <div class="auth-field"><label class="auth-label">邮箱</label><input class="auth-input" id="regEmail" type="email"></div>
      <div class="auth-field"><label class="auth-label">密码 (6位+)</label><input class="auth-input" id="regPass" type="password"></div>
      <div class="auth-field"><label class="auth-label">头像</label><div class="avatar-grid" id="avatarGrid"></div></div>
      <button class="auth-btn" onclick="doRegister()">创建账号</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<div class="app-layout" id="appLayout">
  <div class="sidebar">
    <div class="sidebar-logo">○</div>
    <div class="nav-icon active" onclick="showFeed()">🏠</div>
    <div class="nav-icon" onclick="openSearch()">🔍</div>
    <div class="nav-icon" id="friendNav" onclick="showFriendsPane()">👥<span class="nav-badge" id="friendBadge"></span></div>
    <div class="nav-icon" id="notifNav" onclick="loadNotifs()">🔔<span class="nav-badge" id="notifBadge"></span></div>
    <div class="sidebar-bottom"><div class="my-avatar-btn" id="myAvatarBtn" onclick="openMyProfile()">🐱</div></div>
  </div>

  <div class="main-area">
    <div class="left-col">
      <div class="col-header">我的圈子 <button class="col-add-btn" onclick="openNewCircle()">＋</button></div>
      <div class="circles-list" id="circleList"></div>
    </div>
    <div class="feed-col">
      <div class="composer">
        <div class="composer-top">
          <div class="composer-avatar" id="composerAvatar">🐱</div>
          <textarea class="composer-input" id="postInput" placeholder="分享点什么..." rows="2"></textarea>
        </div>
        <div id="imgPreviewWrap" style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;"></div>
        <div class="composer-bottom">
          <label style="cursor:pointer;font-size:18px;">🖼️<input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="previewImages(this)"></label>
          <select class="circle-picker" id="circleSelect" style="font-size:11px;margin-left:10px;border-radius:10px;border:1px solid #ddd;"></select>
          <button class="post-btn" id="postBtn" onclick="submitPost()">发布</button>
        </div>
      </div>
      <div id="postFeed"></div>
    </div>
    <div class="right-col">
      <div class="right-section"><div class="right-title">好友动态</div><div id="friendList"></div></div>
      <div class="right-section"><div class="right-title">最新通知</div><div id="notifList"></div></div>
    </div>
  </div>
</div>

<!-- DM Panel -->
<div class="dm-panel" id="dmPanel">
  <div class="dm-box">
    <div style="padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
      <span id="dmName" style="font-weight:500;">聊天</span>
      <button onclick="closeDM()" style="border:none;background:none;cursor:pointer;">✕</button>
    </div>
    <div class="dm-messages" id="dmMessages"></div>
    <div style="padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;">
      <input class="auth-input" id="dmInput" placeholder="说点什么..." style="padding:8px;">
      <button class="post-btn" onclick="sendDM()">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 请替换为你自己的 Supabase 配置
const SUPABASE_URL='https://farhnpvvqhkfuxqpugqx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhcmhucHZ2cWhrZnV4cXB1Z3F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTQ3MTEsImV4cCI6MjA5MzI5MDcxMX0.02krqHSqfBGwgpT3nFHy_S5Ukujt_RlHAxj-yt1Kz84'; // 此处需补全
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null, myProfile=null, circles=[], currentCircle='all', selectedFiles=[], dmChannel=null, dmUserId=null;

// --- 基础交互逻辑 ---
function switchTab(m){
  document.getElementById('loginForm').style.display=m==='login'?'block':'none';
  document.getElementById('registerForm').style.display=m==='register'?'block':'none';
  document.getElementById('loginTab').classList.toggle('active',m==='login');
  document.getElementById('registerTab').classList.toggle('active',m==='register');
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

// --- 图片压缩逻辑 (上线必用) ---
async function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1000;
        let width = img.width, height = img.height;
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(new File([blob], file.name, {type:'image/jpeg'})), 'image/jpeg', 0.7);
      };
    };
  });
}

function previewImages(input){
  selectedFiles = Array.from(input.files);
  const wrap = document.getElementById('imgPreviewWrap');
  wrap.innerHTML = selectedFiles.map(f => `<img src="${URL.createObjectURL(f)}" style="width:50px;height:50px;border-radius:5px;object-fit:cover;">`).join('');
}

// --- Auth 逻辑 ---
async function doLogin(){
  const email=document.getElementById('loginEmail').value;
  const pass=document.getElementById('loginPassword').value;
  const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error) { document.getElementById('authErr').textContent = error.message; }
}

sb.auth.onAuthStateChange(async(event, session)=>{
  if(session?.user){
    currentUser = session.user;
    document.getElementById('authScreen').style.display='none';
    document.getElementById('appLayout').style.display='flex';
    document.getElementById('appLayout').classList.add('visible');
    // 初始化数据加载
    await loadMyProfile();
    loadAll();
  } else {
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('appLayout').style.display='none';
  }
});

async function loadMyProfile(){
  const {data} = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  myProfile = data;
  if(myProfile) document.getElementById('myAvatarBtn').textContent = myProfile.avatar;
}

// --- 动态与私信逻辑 ---
async function submitPost(){
  const content = document.getElementById('postInput').value;
  if(!content && selectedFiles.length===0) return;
  const btn = document.getElementById('postBtn'); btn.disabled=true;
  
  let imageUrls = [];
  for(const f of selectedFiles){
    const compressed = await compressImage(f);
    const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).substr(2,5)}.jpg`;
    const {data, error} = await sb.storage.from('post-images').upload(path, compressed);
    if(!error) {
       const {data:urlData} = sb.storage.from('post-images').getPublicUrl(path);
       imageUrls.push(urlData.publicUrl);
    }
  }

  await sb.from('posts').insert({
    user_id: currentUser.id,
    content,
    images: imageUrls,
    circle_id: document.getElementById('circleSelect').value || null
  });

  document.getElementById('postInput').value='';
  document.getElementById('imgPreviewWrap').innerHTML='';
  selectedFiles=[]; btn.disabled=false;
  showToast('发布成功！');
  loadPosts();
}

async function openDM(uid, name){
  if(dmChannel) { sb.removeChannel(dmChannel); dmChannel=null; }
  dmUserId = uid;
  document.getElementById('dmName').textContent = name;
  document.getElementById('dmPanel').classList.add('open');
  
  // 加载历史记录
  const {data} = await sb.from('messages').select('*').or(`and(from_user_id.eq.${currentUser.id},to_user_id.eq.${uid}),and(from_user_id.eq.${uid},to_user_id.eq.${currentUser.id})`).order('created_at');
  renderDMs(data||[]);

  // 实时订阅
  dmChannel = sb.channel(`room-${uid}`)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload => {
      if(payload.new.from_user_id === uid || payload.new.to_user_id === uid) loadDMsOnly();
    }).subscribe();
}

function closeDM(){
  document.getElementById('dmPanel').classList.remove('open');
  if(dmChannel) sb.removeChannel(dmChannel);
}

// --- 初始化调用 ---
async function loadAll(){
  loadPosts();
  // 其他加载逻辑...
}

async function loadPosts(){
  const {data} = await sb.from('posts').select('*, profiles(username, avatar)').order('created_at', {ascending:false});
  document.getElementById('postFeed').innerHTML = (data||[]).map(p => `
    <div class="post-card">
      <div class="post-header">
        <div class="post-avatar">${p.profiles?.avatar||'👤'}</div>
        <div class="post-meta"><div class="post-author">${p.profiles?.username}</div><div class="post-time">刚刚</div></div>
      </div>
      <div class="post-body">${p.content}</div>
      ${p.images? `<div class="post-images n1">${p.images.map(img=>`<img src="${img}" class="post-img">`).join('')}</div>` : ''}
    </div>
  `).join('');
}
</script>
</body>
</html>
