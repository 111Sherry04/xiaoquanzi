<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小圈子</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf8f3;--surface:#fff;--surface2:#faf6f1;--border:#ede8e0;
  --text:#2d2520;--muted:#9e8e80;--dim:#c8bdb0;
  --accent:#e8734a;--green:#6b9e78;--blue:#7b8fc4;--pink:#e8a0b0;
  --shadow:0 2px 16px rgba(45,37,32,0.08);--shadow-lg:0 8px 40px rgba(45,37,32,0.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── Auth ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf8f3,#fdf0e8);}
.auth-box{background:var(–surface);border-radius:24px;padding:40px 36px;width:400px;max-width:90vw;box-shadow:var(–shadow-lg);}
.auth-logo{font-family:‘Lora’,serif;font-size:32px;color:var(–accent);margin-bottom:6px;}
.auth-tagline{font-size:13px;color:var(–muted);margin-bottom:28px;line-height:1.6;}
.auth-tabs{display:flex;margin-bottom:20px;border:1px solid var(–border);border-radius:10px;overflow:hidden;}
.auth-tab{flex:1;padding:10px;background:transparent;border:none;font-family:inherit;font-size:13px;cursor:pointer;color:var(–muted);transition:all .2s;}
.auth-tab.active{background:var(–accent);color:#fff;}
.auth-field{margin-bottom:12px;}
.auth-label{font-size:11px;letter-spacing:.08em;color:var(–muted);margin-bottom:5px;display:block;text-transform:uppercase;}
.auth-input{width:100%;background:var(–surface2);border:1px solid var(–border);color:var(–text);padding:10px 14px;font-family:inherit;font-size:13px;border-radius:10px;outline:none;transition:border-color .2s;}
.auth-input:focus{border-color:var(–accent);}
.auth-btn{width:100%;padding:12px;background:var(–accent);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s;margin-top:4px;}
.auth-btn:hover{opacity:.85;} .auth-btn:disabled{opacity:.5;cursor:not-allowed;}
.auth-err{font-size:12px;color:#e87b8a;margin-top:8px;text-align:center;min-height:18px;}
.avatar-grid{display:flex;gap:8px;flex-wrap:wrap;}
.avatar-opt{font-size:22px;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent;transition:border-color .15s;}
.avatar-opt.selected{border-color:var(–accent);}

/* ── App ── */
.app-layout{display:none;height:100vh;overflow:hidden;}
.app-layout.visible{display:flex;}

/* Sidebar */
.sidebar{width:68px;background:var(–surface);border-right:1px solid var(–border);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:4px;position:fixed;left:0;top:0;bottom:0;z-index:50;}
.sidebar-logo{font-family:‘Lora’,serif;font-size:20px;color:var(–accent);margin-bottom:14px;cursor:pointer;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:19px;cursor:pointer;transition:all .2s;color:var(–dim);position:relative;}
.nav-icon:hover{background:var(–surface2);color:var(–text);}
.nav-icon.active{background:rgba(232,115,74,.1);color:var(–accent);}
.notif-badge{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(–accent);border-radius:50%;border:2px solid var(–surface);display:none;}
.notif-badge.show{display:block;}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;}
.my-avatar-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid var(–border);cursor:pointer;background:linear-gradient(135deg,#e8734a20,#e8a0b020);transition:border-color .2s;}
.my-avatar-btn:hover{border-color:var(–accent);}

/* Main */
.main-area{margin-left:68px;display:flex;width:calc(100vw - 68px);height:100vh;overflow:hidden;}
.left-col{width:210px;min-width:210px;background:var(–surface);border-right:1px solid var(–border);display:flex;flex-direction:column;overflow:hidden;}
.col-header{padding:18px 14px 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(–muted);border-bottom:1px solid var(–border);display:flex;justify-content:space-between;align-items:center;}
.col-add-btn{width:20px;height:20px;border-radius:6px;background:var(–surface2);border:none;color:var(–muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.col-add-btn:hover{background:var(–accent);color:#fff;}
.circles-list{overflow-y:auto;flex:1;padding:8px 6px;}
.circle-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px;}
.circle-item:hover{background:var(–surface2);}
.circle-item.active{background:rgba(232,115,74,.08);}
.circle-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.circle-name{font-size:12px;flex:1;}
.circle-item.active .circle-name{color:var(–accent);font-weight:500;}

/* Feed */
.feed-col{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;}
.composer{background:var(–surface);border:1px solid var(–border);border-radius:16px;padding:16px 18px;margin-bottom:20px;box-shadow:var(–shadow);}
.composer-top{display:flex;gap:10px;align-items:flex-start;}
.composer-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(135deg,rgba(232,115,74,.12),rgba(232,160,176,.12));}
.composer-input{flex:1;background:var(–surface2);border:1px solid var(–border);border-radius:10px;padding:9px 13px;font-family:inherit;font-size:13px;color:var(–text);resize:none;outline:none;min-height:42px;max-height:110px;transition:border-color .2s;line-height:1.6;}
.composer-input:focus{border-color:var(–accent);}
.composer-input::placeholder{color:var(–dim);}
.composer-bottom{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(–border);flex-wrap:wrap;}
.composer-tool{background:none;border:none;color:var(–muted);font-size:15px;cursor:pointer;padding:4px 7px;border-radius:6px;transition:all .15s;}
.composer-tool:hover{background:var(–surface2);color:var(–accent);}
.img-preview-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.img-preview{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(–border);position:relative;}
.img-preview-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:var(–text);color:#fff;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;}
.circle-picker{background:var(–surface2);border:1px solid var(–border);color:var(–text);font-family:inherit;font-size:11px;padding:5px 9px;border-radius:20px;outline:none;cursor:pointer;}
.post-btn{margin-left:auto;background:var(–accent);color:#fff;border:none;padding:6px 18px;border-radius:20px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .2s;}
.post-btn:hover{opacity:.85;} .post-btn:disabled{opacity:.5;cursor:not-allowed;}

/* Posts */
.post-card{background:var(–surface);border:1px solid var(–border);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(–shadow);animation:fadeUp .4s ease;transition:box-shadow .2s;}
.post-card:hover{box-shadow:var(–shadow-lg);}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;}
.post-meta{flex:1;}
.post-author{font-size:13px;font-weight:500;cursor:pointer;}
.post-author:hover{color:var(–accent);}
.post-time{font-size:10px;color:var(–muted);margin-top:1px;}
.post-circle-tag{font-size:9px;padding:2px 9px;border-radius:20px;font-weight:500;}
.post-body{font-size:13px;line-height:1.8;margin-bottom:12px;}
.post-images{display:grid;gap:4px;margin-bottom:12px;border-radius:10px;overflow:hidden;}
.post-images.n1{grid-template-columns:1fr;}
.post-images.n2{grid-template-columns:1fr 1fr;}
.post-images.n3{grid-template-columns:1fr 1fr 1fr;}
.post-images.n4{grid-template-columns:1fr 1fr;}
.post-img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;transition:opacity .2s;}
.post-img:hover{opacity:.9;}
.post-footer{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(–border);}
.reaction-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(–muted);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s;}
.reaction-btn:hover{background:var(–surface2);color:var(–accent);}
.reaction-btn.liked{color:var(–accent);}

/* Emoji reactions */
.emoji-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.emoji-chip{font-size:13px;padding:2px 8px;background:var(–surface2);border:1px solid var(–border);border-radius:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:3px;}
.emoji-chip:hover{border-color:var(–accent);}
.emoji-chip.mine{background:rgba(232,115,74,.1);border-color:var(–accent);}
.emoji-count{font-size:11px;color:var(–muted);}

/* Comments */
.comments-section{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
.comment{display:flex;gap:7px;align-items:flex-start;}
.comment-avatar{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(–surface2);cursor:pointer;}
.comment-bubble{background:var(–surface2);border-radius:10px;padding:6px 11px;font-size:12px;line-height:1.6;flex:1;}
.comment-name{font-weight:500;font-size:10px;margin-bottom:1px;color:var(–muted);}
.comment-input-row{display:flex;gap:7px;margin-top:7px;align-items:center;}
.comment-input{flex:1;background:var(–surface2);border:1px solid var(–border);border-radius:20px;padding:6px 13px;font-family:inherit;font-size:12px;color:var(–text);outline:none;transition:border-color .2s;}
.comment-input:focus{border-color:var(–accent);}
.comment-send{background:none;border:1px solid var(–border);color:var(–muted);padding:6px 13px;border-radius:20px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;}
.comment-send:hover{background:var(–accent);color:#fff;border-color:var(–accent);}

/* Right col */
.right-col{width:240px;min-width:240px;border-left:1px solid var(–border);background:var(–surface);overflow-y:auto;padding:18px 14px;}
.right-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(–muted);margin-bottom:10px;margin-top:18px;}
.right-title:first-child{margin-top:0;}
.notif-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(–border);}
.notif-item:last-child{border-bottom:none;}
.notif-icon{font-size:15px;margin-top:1px;flex-shrink:0;}
.notif-text{font-size:11px;line-height:1.6;color:var(–muted);}
.notif-text strong{color:var(–text);}
.notif-time{font-size:10px;color:var(–dim);margin-top:2px;}
.notif-unread{background:rgba(232,115,74,.04);border-radius:8px;padding:6px 8px;margin:-2px -4px;}

/* Profile panel */
.profile-panel{display:none;position:fixed;inset:0;z-index:100;background:rgba(45,37,32,.3);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.profile-panel.open{display:flex;}
.profile-box{background:var(–surface);border-radius:20px;width:420px;max-width:90vw;max-height:90vh;overflow-y:auto;box-shadow:var(–shadow-lg);}
.profile-cover{height:100px;background:linear-gradient(135deg,var(–accent),var(–pink));position:relative;}
.profile-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.2);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.profile-avatar-big{width:72px;height:72px;border-radius:50%;background:var(–surface);border:3px solid var(–surface);display:flex;align-items:center;justify-content:center;font-size:36px;position:absolute;bottom:-36px;left:24px;}
.profile-info{padding:48px 24px 20px;}
.profile-name-big{font-size:20px;font-weight:700;font-family:‘Lora’,serif;}
.profile-bio{font-size:12px;color:var(–muted);margin-top:4px;line-height:1.6;}
.profile-stats{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(–border);}
.profile-stat{text-align:center;}
.profile-stat-num{font-size:18px;font-weight:700;font-family:‘Lora’,serif;}
.profile-stat-label{font-size:10px;color:var(–muted);margin-top:2px;}
.profile-posts{padding:0 24px 24px;}
.profile-posts-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(–muted);margin-bottom:12px;}
.profile-post-mini{background:var(–surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.6;cursor:pointer;}
.profile-post-mini:hover{background:var(–border);}
.profile-actions{display:flex;gap:8px;margin-top:14px;}
.profile-btn{flex:1;padding:9px;border-radius:10px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s;font-weight:500;}
.profile-btn-primary{background:var(–accent);color:#fff;border:none;}
.profile-btn-secondary{background:var(–surface2);color:var(–muted);border:1px solid var(–border);}
.logout-btn{width:100%;padding:10px;background:transparent;border:1px solid #e87b8a;color:#e87b8a;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s;margin-top:10px;}
.logout-btn:hover{background:#e87b8a;color:#fff;}

/* Search panel */
.search-panel{display:none;position:fixed;inset:0;z-index:100;background:rgba(45,37,32,.3);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding-top:80px;}
.search-panel.open{display:flex;}
.search-box{background:var(–surface);border-radius:16px;width:480px;max-width:90vw;box-shadow:var(–shadow-lg);overflow:hidden;}
.search-input-wrap{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(–border);gap:10px;}
.search-icon{font-size:18px;color:var(–muted);}
.search-input{flex:1;background:none;border:none;font-family:inherit;font-size:14px;color:var(–text);outline:none;}
.search-results{max-height:320px;overflow-y:auto;}
.search-result-item{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(–border);}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(–surface2);}
.search-result-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(–surface2);}
.search-result-name{font-size:13px;font-weight:500;}
.search-result-bio{font-size:11px;color:var(–muted);margin-top:2px;}
.search-invite-btn{margin-left:auto;background:var(–accent);color:#fff;border:none;padding:5px 14px;border-radius:20px;font-family:inherit;font-size:11px;cursor:pointer;transition:opacity .2s;flex-shrink:0;}
.search-invite-btn:hover{opacity:.8;}
.search-empty{padding:32px;text-align:center;color:var(–muted);font-size:13px;}

/* Image lightbox */
.lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;}
.lightbox-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(45,37,32,.4);backdrop-filter:blur(4px);z-index:150;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(–surface);border-radius:20px;padding:26px 30px;width:380px;max-width:90vw;box-shadow:var(–shadow-lg);transform:translateY(20px);transition:transform .25s;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-title{font-family:‘Lora’,serif;font-size:19px;margin-bottom:5px;}
.modal-sub{font-size:12px;color:var(–muted);margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-label{font-size:11px;letter-spacing:.08em;color:var(–muted);margin-bottom:5px;display:block;text-transform:uppercase;}
.modal-input{width:100%;background:var(–surface2);border:1px solid var(–border);color:var(–text);padding:9px 13px;font-family:inherit;font-size:13px;border-radius:10px;outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:var(–accent);}
.modal-row{display:flex;gap:9px;}
.modal-btn{flex:1;padding:10px;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s;font-weight:500;}
.modal-btn-primary{background:var(–accent);color:#fff;border:none;}
.modal-btn-primary:hover{opacity:.85;}
.modal-btn-secondary{background:var(–surface2);color:var(–muted);border:1px solid var(–border);}

/* Emoji picker */
.emoji-picker{display:none;position:absolute;bottom:48px;left:0;background:var(–surface);border:1px solid var(–border);border-radius:14px;padding:12px;box-shadow:var(–shadow-lg);z-index:10;display:none;}
.emoji-picker.open{display:block;}
.emoji-picker-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.emoji-opt{font-size:20px;cursor:pointer;padding:4px;border-radius:6px;text-align:center;transition:background .1s;}
.emoji-opt:hover{background:var(–surface2);}

/* Feed empty/loading */
.feed-empty{text-align:center;padding:50px 20px;color:var(–muted);}
.feed-empty-icon{font-size:36px;margin-bottom:10px;opacity:.4;}
.feed-empty-text{font-size:13px;line-height:1.8;}
.loading-dots{display:flex;gap:6px;justify-content:center;padding:40px;}
.dot{width:7px;height:7px;background:var(–accent);border-radius:50%;animation:pulse 1.2s ease infinite;}
.dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(–text);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;z-index:300;transition:transform .3s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
</style>

</head>
<body>

<!-- ── Auth ── -->

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">○ 小圈子</div>
    <div class="auth-tagline">和异地好友分享你的每一天<br>不同圈子，不同故事 🌸</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" id="registerTab" onclick="switchTab('register')">注册</button>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label class="auth-label">邮箱</label><input class="auth-input" id="loginEmail" type="email" placeholder="your@email.com"></div>
      <div class="auth-field"><label class="auth-label">密码</label><input class="auth-input" id="loginPassword" type="password" placeholder="••••••••"></div>
      <button class="auth-btn" id="loginBtn" onclick="doLogin()">登录</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="auth-field"><label class="auth-label">昵称</label><input class="auth-input" id="regName" placeholder="你的名字"></div>
      <div class="auth-field"><label class="auth-label">邮箱</label><input class="auth-input" id="regEmail" type="email" placeholder="your@email.com"></div>
      <div class="auth-field"><label class="auth-label">密码（至少6位）</label><input class="auth-input" id="regPass" type="password" placeholder="••••••••"></div>
      <div class="auth-field"><label class="auth-label">自我介绍（选填）</label><input class="auth-input" id="regBio" placeholder="用一句话介绍自己…"></div>
      <div class="auth-field">
        <label class="auth-label">选个头像</label>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>
      <button class="auth-btn" id="registerBtn" onclick="doRegister()">创建账号</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- ── App ── -->

<div class="app-layout" id="appLayout">
  <div class="sidebar">
    <div class="sidebar-logo">○</div>
    <div class="nav-icon active" title="动态">🏠</div>

function timeAgo(ts){
  const d=(Date.now()-new Date(ts))/1000;
  if(d<60)return '刚刚';if(d<3600)return Math.floor(d/60)+'分钟前';
  if(d<86400)return Math.floor(d/3600)+'小时前';return Math.floor(d/86400)+'天前';
}

  // Emoji reactions summary
  const emojiMap={};
  likes.forEach(l=>{if(l.emoji){emojiMap[l.emoji]=(emojiMap[l.emoji]||[]);emojiMap[l.emoji].push(l.user_id);}});
  const emojiBarHtml=Object.entries(emojiMap).map(([emoji,users])=>`

    </div>

    ${imgsHtml}
    ${emojiBarHtml?`<div class="emoji-bar">${emojiBarHtml}</div>`:''}
    <div class="post-footer">
      <div style="position:relative;display:flex;gap:4px;">

      </div>
      <button class="reaction-btn" onclick="toggleComments('${p.id}')">💬 ${comments.length}</button>

        <button class="comment-send" onclick="addComment('${p.id}')">发送</button>
      </div>
    </div>
  </div>`;
}

async function reactEmoji(postId,emoji){
  const{data:existing}=await sb.from('likes').select('*').eq('post_id',postId).eq('user_id',currentUser.id).eq('emoji',emoji).single().catch(()=>({data:null}));
  if(existing){
    await sb.from('likes').delete().eq('post_id',postId).eq('user_id',currentUser.id).eq('emoji',emoji);
  } else {
    await sb.from('likes').insert({post_id:postId,user_id:currentUser.id,emoji});
    // Send notification
    const{data:post}=await sb.from('posts').select('user_id').eq('id',postId).single();
    if(post&&post.user_id!==currentUser.id){
      await sb.from('notifications').insert({user_id:post.user_id,from_user_id:currentUser.id,type:'react',post_id:postId,content:`${myProfile?.username||'有人'} 对你的动态回应了 ${emoji}`}).catch(()=>{});
    }
  }
  loadPosts();
}

function toggleComments(postId){
  const el=document.getElementById('comments-'+postId);
  const show=el.style.display==='none';
  el.style.display=show?'flex':'none';

async function addComment(postId){
  const input=document.getElementById('cinput-'+postId);
  const text=input.value.trim();if(!text)return;
  input.value='';
  await sb.from('comments').insert({post_id:postId,user_id:currentUser.id,content:text});

  const{data:post}=await sb.from('posts').select('user_id').eq('id',postId).single();
  if(post&&post.user_id!==currentUser.id){
    await sb.from('notifications').insert({user_id:post.user_id,from_user_id:currentUser.id,type:'comment',post_id:postId,content:`${myProfile?.username||'有人'} 评论了你的动态：${text.slice(0,20)}`}).catch(()=>{});
  }
  loadPosts();
  setTimeout(()=>toggleComments(postId),80);
}

// ── Image upload ──
let selectedFiles=[];
function previewImages(input){
  selectedFiles=Array.from(input.files);
  const wrap=document.getElementById('imgPreviewWrap');
  wrap.innerHTML=selectedFiles.map((f,i)=>{
    const url=URL.createObjectURL(f);
    return `<div style="position:relative;display:inline-block;">
      <img class="img-preview" src="${url}">
      <button class="img-preview-del" onclick="removeImage(${i})">✕</button>
    </div>`;}).join('');
}
function removeImage(i){
  selectedFiles.splice(i,1);
  const dt=new DataTransfer();
  selectedFiles.forEach(f=>dt.items.add(f));
  document.getElementById('imgInput').files=dt.files;
  previewImages(document.getElementById('imgInput'));
}

async function uploadImages(){
  if(!selectedFiles.length)return[];
  const urls=[];
  for(const file of selectedFiles){
    const ext=file.name.split('.').pop();
    const path=`${currentUser.id}/${Date.now()}.${ext}`;
    const{error}=await sb.storage.from('post-images').upload(path,file,{contentType:file.type});
    if(!error){
      const{data}=sb.storage.from('post-images').getPublicUrl(path);
      urls.push(data.publicUrl);
    }
  }
  return urls;
}

async function submitPost(){
  const content=document.getElementById('postInput').value.trim();
  if(!content&&selectedFiles.length===0){showToast('请输入内容或选择图片');return;}
  const btn=document.getElementById('postBtn');
  btn.disabled=true;btn.textContent='发布中…';
  const imageUrls=await uploadImages();
  const circleId=document.getElementById('circleSelect').value||null;
  const{error}=await sb.from('posts').insert({user_id:currentUser.id,circle_id:circleId,content:content||'',images:imageUrls});
  btn.disabled=false;btn.textContent='发布';
  if(error){showToast('发布失败，请重试');return;}
  document.getElementById('postInput').value='';
  selectedFiles=[];document.getElementById('imgPreviewWrap').innerHTML='';
  document.getElementById('imgInput').value='';
  showToast('发布成功 ✨');loadPosts();
}

  if(!user)return;
  viewingProfile=user;
  document.getElementById('profileAvatarBig').textContent=user.avatar||'👤';
  document.getElementById('profileNameBig').textContent=user.username;
  document.getElementById('profileBioText').textContent=user.bio||'这个人很懒，什么都没写～';
  // Posts
  const{data:posts}=await sb.from('posts').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(5);
  document.getElementById('profilePostCount').textContent=posts?.length||0;
  document.getElementById('profilePostsList').innerHTML=(posts||[]).map(p=>`
    <div class="profile-post-mini">${p.content.slice(0,60)}${p.content.length>60?'…':''}<br><span style="font-size:10px;color:var(--dim)">${timeAgo(p.created_at)}</span></div>`).join('');
  // Likes received
  const{count}=await sb.from('likes').select('*',{count:'exact',head:true}).in('post_id',(posts||[]).map(p=>p.id));
  document.getElementById('profileLikeCount').textContent=count||0;
  // Actions
  const isMe=uid===currentUser.id;
  document.getElementById('logoutBtn').style.display=isMe?'':'none';
  document.getElementById('profileActions').innerHTML=isMe?'':`<button class="profile-btn profile-btn-primary" onclick="showToast('直接把网址分享给朋友，让他们注册就能看到你的动态！')">邀请 Ta 加入</button>`;
  document.getElementById('profilePanel').classList.add('open');
}
function openMyProfile(){openUserProfile(currentUser.id);}
function closeProfile(){document.getElementById('profilePanel').classList.remove('open');}

// ── Notifications ──
async function loadNotifs(){
  const{data}=await sb.from('notifications').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(10).catch(()=>({data:null}));
  if(!data||data.length===0){
    document.getElementById('notifList').innerHTML='<div style="font-size:12px;color:var(--dim);padding:8px 0">暂无通知</div>';
    return;
  }
  const unread=data.filter(n=>!n.read).length;
  document.getElementById('notifBadge').classList.toggle('show',unread>0);
  document.getElementById('notifList').innerHTML=data.map(n=>`
    <div class="notif-item ${!n.read?'notif-unread':''}">
      <div class="notif-icon">${n.type==='react'?'❤️':n.type==='comment'?'💬':'🔔'}</div>
      <div><div class="notif-text">${n.content}</div><div class="notif-time">${timeAgo(n.created_at)}</div></div>
    </div>`).join('');
  // Mark as read
  await sb.from('notifications').update({read:true}).eq('user_id',currentUser.id).catch(()=>{});
}

function subscribeNotifs(){
  sb.channel('notifs').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${currentUser.id}`},()=>{
    loadNotifs();showToast('你有新的通知 🔔');
    document.getElementById('notifBadge').classList.add('show');
  }).subscribe();
}

async function loadOnlineFriends(){
  // Show all profiles (simplified - no real presence)
  const{data}=await sb.from('profiles').select('*').neq('id',currentUser.id).limit(8);
  document.getElementById('onlineFriends').innerHTML=(data||[]).map(u=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="openUserProfile('${u.id}')">
      <span style="font-size:18px">${u.avatar||'👤'}</span>
      <span style="font-size:12px">${u.username}</span>
    </div>`).join('')||'<div style="font-size:12px;color:var(--dim);padding:8px 0">邀请朋友加入吧～</div>';
}

// ── Lightbox ──
function openLightbox(url){document.getElementById('lightboxImg').src=url;document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}

// ── Toast ──
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

// Close modals
['circleModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)closeModal(id);});
});
document.getElementById('postInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.metaKey)submitPost();});
</script>
